# Application
spring.application.name=backend

# Local runs: pick up DB_PASSWORD, JWT_SECRET and the rest from the repo's .env
# (../.env when started from backend/ with ./mvnw spring-boot:run), the same
# file Docker Compose reads. Optional, so it is simply skipped where there is
# no such file, and real environment variables always take precedence over it:
# in Docker and in production nothing changes.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mordi
spring.datasource.username=mordi_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080

# JWT
mordi.jwt.secret=${JWT_SECRET}
# The access token. Short on purpose: it is sent on every request and cannot be
# revoked, so its lifetime is the worst case for a stolen one. The refresh
# cookie below is what keeps someone signed in past it. 15 minutes.
mordi.jwt.expiration=${JWT_EXPIRATION_MS:900000}

# Refresh tokens
mordi.auth.refresh-ttl-days=${REFRESH_TTL_DAYS:30}
# Browsers accept Secure cookies from http://localhost, so this can stay on in
# local development too. Only turn it off for a plain-http deployment.
mordi.auth.cookie-secure=${COOKIE_SECURE:true}

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

# Web Push reminders. Off unless both keys are set. Generate a pair with:
#   node -e "const {generateKeyPairSync}=require('crypto');const k=generateKeyPairSync('ec',{namedCurve:'prime256v1'}).privateKey.export({format:'jwk'});console.log('VAPID_PUBLIC_KEY='+Buffer.concat([Buffer.from([4]),Buffer.from(k.x,'base64url'),Buffer.from(k.y,'base64url')]).toString('base64url'));console.log('VAPID_PRIVATE_KEY='+k.d)"
mordi.push.vapid-public-key=${VAPID_PUBLIC_KEY:}
mordi.push.vapid-private-key=${VAPID_PRIVATE_KEY:}
mordi.push.subject=${VAPID_SUBJECT:mailto:hello@latesailor.dev}
