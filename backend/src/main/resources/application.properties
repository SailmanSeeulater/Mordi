# Application
spring.application.name=backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mordi
spring.datasource.username=mordi_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Server
server.port=8080

# JWT
mordi.jwt.secret=${JWT_SECRET}
# The access token. Short on purpose: it is sent on every request and cannot be
# revoked, so its lifetime is the worst case for a stolen one. The refresh
# cookie below is what keeps someone signed in past it. 15 minutes.
mordi.jwt.expiration=${JWT_EXPIRATION_MS:900000}

# Refresh tokens
mordi.auth.refresh-ttl-days=${REFRESH_TTL_DAYS:30}
# Browsers accept Secure cookies from http://localhost, so this can stay on in
# local development too. Only turn it off for a plain-http deployment.
mordi.auth.cookie-secure=${COOKIE_SECURE:true}

# Flyway
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.readinessstate.enabled=true
management.health.livenessstate.enabled=true

