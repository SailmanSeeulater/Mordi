version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mordi-postgres
    environment:
      POSTGRES_DB: mordi
      POSTGRES_USER: mordi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: mordi-redis
    restart: unless-stopped

  backend:
    # Both, deliberately. On the VPS the tag is pulled from GHCR, already built
    # by CI; locally `docker compose build` builds it and tags it with the same
    # name. Without `image:` a `pull` skips the service and `up -d` keeps
    # whatever is already running, so a deploy reports success and changes
    # nothing. MORDI_TAG pins a deploy to one commit, so a rollback is
    # `MORDI_TAG=<sha> docker-compose up -d` with no rebuild.
    image: ghcr.io/sailmanseeulater/mordi-backend:${MORDI_TAG:-latest}
    build: ./backend
    container_name: mordi-backend
    # Loopback only. The host's nginx proxies to these ports on localhost,
    # and a port Docker publishes on 0.0.0.0 bypasses ufw entirely, so
    # without the address the API would be reachable from the internet
    # directly, TLS and rate limits skipped.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mordi
      SPRING_DATASOURCE_USERNAME: mordi_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MORDI_JWT_SECRET: ${JWT_SECRET}
      MORDI_JWT_EXPIRATION: 900000
      # Email through Resend; optional. Without the key, mail is logged by
      # the backend instead of sent. APP_URL is where emailed links point.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: "${MAIL_FROM:-Mordi <hello@latesailor.dev>}"
      APP_URL: ${APP_URL:-https://mordi.latesailor.dev}
      # Web Push reminders; optional. Without both keys reminders stay off.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@latesailor.dev}
      # Who may open the usage numbers; comma-separated sign-in addresses.
      # Empty means nobody.
      MORDI_ADMIN_EMAILS: ${MORDI_ADMIN_EMAILS:-}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    image: ghcr.io/sailmanseeulater/mordi-frontend:${MORDI_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    container_name: mordi-frontend
    # Loopback for the same reason as the backend's port.
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
