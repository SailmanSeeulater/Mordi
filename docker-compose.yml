version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: mordi-postgres
    environment:
      POSTGRES_DB: mordi
      POSTGRES_USER: mordi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: mordi-redis
    restart: always

  backend:
    # Both, deliberately. On the VPS the tag is pulled from GHCR, already built
    # by CI; locally `docker compose build` builds it and tags it with the same
    # name. Without `image:` a `pull` skips the service and `up -d` keeps
    # whatever is already running, so a deploy reports success and changes
    # nothing. MORDI_TAG pins a deploy to one commit, so a rollback is
    # `MORDI_TAG=<sha> docker-compose up -d` with no rebuild.
    image: ghcr.io/sailmanseeulater/mordi-backend:${MORDI_TAG:-latest}
    build: ./backend
    container_name: mordi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mordi
      SPRING_DATASOURCE_USERNAME: mordi_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MORDI_JWT_SECRET: ${JWT_SECRET}
      MORDI_JWT_EXPIRATION: 900000
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "1"
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    image: ghcr.io/sailmanseeulater/mordi-frontend:${MORDI_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
    container_name: mordi-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
