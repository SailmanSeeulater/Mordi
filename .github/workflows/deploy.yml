name: Deploy to VPS

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/sailmanseeulater/mordi-backend
  FRONTEND_IMAGE: ghcr.io/sailmanseeulater/mordi-frontend

jobs:
  # The VPS used to compile Java and bundle Vite itself, on the same machine
  # that serves the site, which is what pushed deploys past their timeout.
  # Here the images are built on GitHub's hardware and the VPS only pulls them.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Fail here rather than shipping a frontend whose Maps key is an empty
      # string: the key is baked in at build time, so a missing secret is a
      # broken map in production and nothing in the build log.
      - name: Check required secrets
        env:
          KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::VITE_GOOGLE_MAPS_API_KEY is not set in repository secrets"
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each image caches under its own scope, so a frontend change never
      # invalidates the backend's Maven layer.
      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
            VITE_UMAMI_WEBSITE_ID=${{ vars.VITE_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          MORDI_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          # The run's own token, valid only while this job runs. Nothing
          # long-lived is stored on the VPS.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: MORDI_TAG,GHCR_USER,GHCR_TOKEN
          # Pulling two images, not building them.
          command_timeout: 10m
          script: |
            set -e
            cd ${{ secrets.VPS_PATH }}

            # Not `time`: that is a bash keyword, this script may run under
            # dash, and with `set -e` a missing `time` would fail the deploy
            # rather than measure it.
            stamp() { echo "== $1 $(date -u +%H:%M:%S)"; }

            stamp "host"
            df -h / || true
            free -h || true

            # The compose file itself still comes from git.
            stamp "pull repo"
            git pull --ff-only

            stamp "login"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # MORDI_TAG is this commit, so the VPS runs exactly what CI built
            # instead of whatever :latest happens to mean by the time it pulls.
            export MORDI_TAG

            # And it is written into .env, which compose reads on its own, so a
            # plain `docker-compose up -d` run by hand later (after editing
            # .env, say) starts this version too. Without it compose falls
            # back to the local :latest, an old image, and quietly rolls the
            # site back: that is how a restart once undid a release.
            touch .env
            sed -i '/^MORDI_TAG=/d' .env
            echo "MORDI_TAG=$MORDI_TAG" >> .env
            stamp "pull images ($MORDI_TAG)"
            docker-compose pull backend frontend

            stamp "up"
            docker-compose up -d --remove-orphans

            stamp "logout"
            docker logout ghcr.io || true
            docker image prune -f

            # up -d only waits for containers to start, not to survive. Without
            # this, a backend that dies during startup still reports a green
            # deploy, which is how the NoSuchMethodException crash went
            # unnoticed. A crash loop trips RestartCount and fails the job with
            # the log that explains it.
            stamp "check"
            docker-compose ps

            # The right version, not merely a running one. A container that
            # is still on last week's image is running and has not restarted,
            # so the liveness check below would pass for it. This is what
            # turned an unchanged site into a green deploy.
            for pair in "mordi-backend:mordi-backend" "mordi-frontend:mordi-frontend"; do
              name=${pair%%:*}
              image=${pair##*:}
              want="ghcr.io/sailmanseeulater/$image:$MORDI_TAG"
              have=$(docker inspect -f '{{.Config.Image}}' "$name")
              if [ "$have" != "$want" ]; then
                echo "$name is running $have, expected $want"
                echo "The deploy did not replace it. Check that docker-compose.yml"
                echo "names this image for the service and that the pull succeeded."
                exit 1
              fi
            done

            # Running is not the same as answering: on this VM the backend
            # takes well over a minute to start, and a fixed 20-second wait
            # once reported a green deploy while the site returned 502. Ask it
            # until it says UP, for up to four minutes, and stop early if the
            # container dies.
            stamp "wait for backend"
            up=""
            for i in $(seq 1 48); do
              if curl -fs -m 3 http://127.0.0.1:8080/actuator/health >/dev/null; then
                up=yes
                break
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' mordi-backend)" != "true" ]; then
                break
              fi
              sleep 5
            done

            restarts=$(docker inspect -f '{{.RestartCount}}' mordi-backend)
            if [ -z "$up" ] || [ "$restarts" != "0" ]; then
              echo "backend is not answering (restarts=$restarts):"
              docker-compose logs --tail=80 backend
              exit 1
            fi
            stamp "done"
