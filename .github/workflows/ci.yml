name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repo, so the token gets read access and no more.
permissions:
  contents: read

# Actions are pinned to a commit rather than a tag: a tag can be moved to
# point at different code, a SHA cannot. The comment says which release it is.
jobs:
  backend:
    name: Backend - build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Build jar
        run: ./mvnw --batch-mode --no-transfer-progress package -DskipTests

  frontend:
    name: Frontend - lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only what ships in the bundle: a high-severity advisory in a dev tool
      # is worth knowing about, not worth blocking a deploy over.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholder value so the Vite build doesn't fail on missing env var in CI
          # The real env is gonna be in the VPS
          VITE_GOOGLE_MAPS_API_KEY: "ci-placeholder-key"