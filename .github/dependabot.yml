# Weekly bumps for everything that is pinned: the actions in the workflows,
# the frontend's npm packages, the backend's Maven dependencies, and the base
# images in the two Dockerfiles. Each ecosystem's minor and patch bumps arrive
# as one grouped PR that CI checks like any other. Major versions are skipped:
# they can need code changes (Spring Boot 4, for one), so they are taken on
# deliberately, not merged from a weekly PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
