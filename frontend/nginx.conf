server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The security headers live in one snippet. nginx drops every inherited
    # add_header in a location that sets its own, so each location below that
    # adds a Cache-Control includes the snippet again.
    include /etc/nginx/snippets/security-headers.conf;

    # Vite hashes everything in /assets/, so a file never changes under its
    # name. The two faces in /fonts/ are not hashed: rename the file when its
    # contents change, or visitors keep the old one for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The entry point and the service worker are what point at the hashed
    # files, so they are always revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
