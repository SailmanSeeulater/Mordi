# The five security headers, included at server level and again in every
# location that sets its own add_header (nginx drops the inherited set in a
# location that declares one). Edit them here, once.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# What the app is allowed to load, and from where. Vite emits module
# scripts only, so script-src needs no 'unsafe-inline'; style-src does,
# for React's style attributes, the custom-theme <style> and the styles
# Maps injects. The Google hosts are the ones Maps JS documents in its own
# CSP guide, scripts narrowed to the two Maps hosts; connect-src also
# carries the weather API. Mordi's own faces are self-hosted; the Google
# Fonts hosts stay only because Maps loads Roboto for its controls, which
# happens on the Places page alone (the Privacy Policy says so under
# Google Maps Platform). data: is for the inline
# SVG backgrounds in the CSS, blob: for the Maps workers. The service
# worker at /sw.js is 'self'.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self' https://maps.googleapis.com https://maps.gstatic.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com https://*.ggpht.com; connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://api.open-meteo.com data: blob:; frame-src https://*.google.com; worker-src 'self' blob:; manifest-src 'self'" always;
