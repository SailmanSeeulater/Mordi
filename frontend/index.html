<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <meta name="description" content="Mordi keeps goals with a weekly target: log an entry in one tap and see the week measured against the target you set." />
        <!-- Sorbet's ground, the default combination, so the browser chrome
             matches the page before it loads. -->
        <meta name="theme-color" content="#fef3f1" />
        <!-- What a shared link shows. The image is a flat 1200×630 card in
             the same ground and ink (public/og.png). -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://mordi.latesailor.dev/" />
        <meta property="og:title" content="Mordi" />
        <meta property="og:description" content="Goals you set. A week that keeps count." />
        <meta property="og:image" content="https://mordi.latesailor.dev/og.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Mordi: goals you set, a week that keeps count." />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Mordi" />
        <meta name="twitter:description" content="Goals you set. A week that keeps count." />
        <meta name="twitter:image" content="https://mordi.latesailor.dev/og.png" />
        <!-- Inter and Source Serif 4 stand in for San Francisco and New York
             on devices that do not have them (see the font tokens in index.css).
             Linked here so they load in parallel and never block first paint. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" />
        <title>Mordi</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
