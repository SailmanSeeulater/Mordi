apiVersion: apps/v1
kind: Deployment
metadata:
  name: mordi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mordi-frontend
  template:
    metadata:
      labels:
        app: mordi-frontend
    spec:
      containers:
        - name: mordi-frontend
          image: mordi-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          # nginx:alpine starts as root to bind port 80 and then drops to its
          # own user for the workers, so runAsNonRoot would stop it from
          # starting at all. It keeps only what that takes: binding the port,
          # switching the workers' user, and owning its cache directories.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mordi-frontend
spec:
  selector:
    app: mordi-frontend
  ports:
    - port: 80
      targetPort: 80
